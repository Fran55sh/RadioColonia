# Stack Coolify: solo web + Postgres externo (recurso Database).
# Deploy normal NO toca la BD. Migraciones: recurso Dockerfile target `migrator` (manual).
# Ver app/docs/DEPLOY.md

name: radiocolonia-coolify

services:
  # Traefik (Coolify) necesita saber el puerto INTERNO de Node (3000). En la UI, asigná el
  # dominio a ESTE servicio en formato https://tu-dominio.com:3000 (el :3000 no implica abrir
  # 3000 en el navegador; ves https://tu-dominio.com en 443 según docs de Coolify).
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - coolify
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      DB_HOST: ${DB_HOST:?}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_NAME: ${DB_NAME:-db}
      DB_PORT: ${DB_PORT:-5432}
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_URL: ${AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
    volumes:
      - radiocolonia_uploads:/app/public/uploads

networks:
  coolify:
    external: true

volumes:
  radiocolonia_uploads:
