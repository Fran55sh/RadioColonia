# Stack Coolify: Postgres + migrate (job) + web.
# La app usa DB_HOST / DB_USER / DB_PASSWORD / DB_NAME / DB_PORT (sin DATABASE_URL).
#
# Orden en `docker compose up`: postgres healthy → migrate termina bien (push + staging + seed)
# → arranca web. Coolify debe incluir todos los servicios del compose en el deploy.
#
# Para jobs one-shot, `exclude_from_hc` evita que Coolify los marque como "unhealthy" al salir.
#
# DB_HOST debe ser el nombre DNS del servicio Postgres DENTRO de la red Compose (`postgres`).
# Coolify suele definir DB_HOST=127.0.0.1 para dev local; si se inyecta en producción rompe migrate/web
# porque dentro del contenedor 127.0.0.1 no es Postgres. Por eso forzamos `postgres` literal en migrate/web.

name: radiocolonia-coolify

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: ${DB_NAME:-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    exclude_from_hc: true
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
      DB_NAME: ${DB_NAME:-db}
      DB_PORT: ${DB_PORT:-5432}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
      DB_NAME: ${DB_NAME:-db}
      DB_PORT: ${DB_PORT:-5432}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    volumes:
      - radiocolonia_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  radiocolonia_uploads:
