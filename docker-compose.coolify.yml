# Stack Coolify: `web` (Next) y `migrate` (drizzle-kit push) en el mismo repo.
#
# La web NO depende de `migrate`: el deploy no se bloquea si la introspección falla.
#
# Despliegue habitual (Coolify / `docker compose up -d`): solo levanta `web` (perfil por defecto).
# Migraciones (manual o job aparte), con el mismo `.env` del stack:
#   docker compose -f docker-compose.coolify.yml --env-file .env --profile migrate run --rm migrate
#
# Si tu UI no pasa `--profile migrate`, el servicio `migrate` no arranca en el up normal.

name: radiocolonia-coolify

services:
  migrate:
    profiles:
      - migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    volumes:
      - radiocolonia_uploads:/app/public/uploads

volumes:
  radiocolonia_uploads:
